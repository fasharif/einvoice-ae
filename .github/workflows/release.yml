name: Release

# Manual only. Publishing needs an npm account for the package and either an NPM_TOKEN
# secret or npm trusted publishing for this repository. The default is a dry run.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run corpus:generate -- --check
      - name: Download artefacts and check SHA-256
        run: npm run artefacts:fetch
      - name: Code lists match the official Schematron
        run: npm run codelists:sync -- --check
      - name: Build the validation image
        run: docker build --tag einvoice-ae-validator:local validator
      - name: XSD and Schematron validation of the corpus and the official examples
        run: npm run test:conformance
      - run: npm run smoke:pack
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
